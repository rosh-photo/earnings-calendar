name: Refresh Earnings Calendar

on:
  schedule:
    # 10:00 AM ET daily (14:00 UTC, or 15:00 UTC during EST)
    - cron: '0 14 * * *'
  workflow_dispatch: # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate earnings calendar
        run: python earnings_calendar.py --output index.html

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Auto-refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes to deploy."
          fi
